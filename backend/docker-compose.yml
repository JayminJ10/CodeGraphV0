services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: codegraph
      POSTGRES_USER: codegraph
      POSTGRES_PASSWORD: codegraph
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://codegraph:codegraph@db:5432/codegraph
    depends_on:
      - db
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - ./storage:/app/storage

volumes:
  postgres_data:
